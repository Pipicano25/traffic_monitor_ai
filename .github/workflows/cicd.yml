name: Pipeline CI/CD Traffic Monitor AI

on:
  push:
    branches: [ dev, main ] # Se activa al hacer push a estas ramas

permissions:
  id-token: write # OBLIGATORIO para usar Workload Identity Federation sin llaves JSON
  contents: read  # Permite a GitHub leer el código del repositorio

env:
  GCP_PROJECT_ID: "traffic-monitor-mlops"
  REGION: "us-central1"
  IMAGE_NAME: "traffic-monitor-app"

jobs:
  # ==========================================
  # ETAPA 1: PRUEBAS UNITARIAS (TEST) - FUNCIONANDO CORRECTAMENTE
  # ==========================================
  test:
    name: Etapa de Pruebas Unitarias MLOps
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Autenticar de forma segura en Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Configurar gcloud CLI
      uses: google-github-actions/setup-gcloud@v2

    - name: Obtener Datos de Prueba desde el Bucket de GCS
      run: |
        mkdir -p tests/data
        gcloud storage cp gs://${{ secrets.GCP_BUCKET_NAME }}/test-data/img1.jpeg ./tests/data/img1.jpeg
        gcloud storage cp gs://${{ secrets.GCP_BUCKET_NAME }}/test-data/img2.jpeg ./tests/data/img2.jpeg

    - name: Obtener Modelo ONNX desde el Bucket de GCS
      run: |
        gcloud storage cp gs://${{ secrets.GCP_BUCKET_NAME }}/models/yolo26n.onnx ./yolo26n.onnx

    - name: Ejecutar Suite de Tests
      env:
        TEST_IMAGE_PATH: "tests/data/img1.jpeg"
        MODEL_PATH: "./yolo26n.onnx"
        EXPECTED_COUNT: "20"
        MAX_ABS_ERROR: "5"
      run: |
        pytest -v
  ##########
  # ==========================================
  # ETAPA 2: EMPAQUETADO Y DESPLIEGUE (BUILD / PROMOTE) - ¡ACTUALIZADA AQUÍ!
  # ==========================================
  build-and-deploy:
    name: Construcción y Despliegue en Cloud Run
    needs: test # ESTA ETAPA SÓLO SE EJECUTA SI LOS TESTS PASAN EN VERDE
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Autenticar de forma segura en Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Configurar gcloud CLI
      uses: google-github-actions/setup-gcloud@v2

    # Configura Docker para que pueda subir imágenes a Google Artifact Registry
    - name: Configurar autenticación de Docker en GCP
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # ------------------------------------------------------------------------
    # NUEVO PASO NUEVO: Descarga el modelo específicamente para construir el contenedor
    # ------------------------------------------------------------------------
    - name: Obtener el modelo del Bucket para la construcción de la imagen
      run: |
        gcloud storage cp gs://${{ secrets.GCP_BUCKET_NAME }}/models/yolo26n.onnx ./yolo26n.onnx

    # Construye la imagen Docker (ahora el Dockerfile sí encontrará el archivo yolo26n.onnx al lado)
    - name: Construir Imagen Docker
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/repository-mlops/${{ env.IMAGE_NAME }}:${{ github.sha }} .

    # Sube el contenedor listo al registro de Google Cloud
    - name: Subir Imagen a Artifact Registry
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/repository-mlops/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # Despliega en Cloud Run inyectando la ruta interna del modelo horneado
    - name: Desplegar en Google Cloud Run
      run: |
        gcloud run deploy traffic-monitor-service \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/repository-mlops/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --set-env-vars MODEL_PATH="/app/yolo26n.onnx"